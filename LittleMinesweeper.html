<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高難度微型望遠鏡踩地雷 - 進階戰術版</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            cursor: none; /* 隱藏原本的滑鼠 */
            user-select: none;
        }

        #info {
            margin-bottom: 10px;
            font-size: 14px;
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.6;
        }
        
        /* 難度選擇樣式 */
        #difficulty-select {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        #difficulty-select button {
            background: #252525;
            color: #aaa;
            border: 1px solid #444;
            padding: 5px 15px;
            cursor: pointer;
            font-family: monospace;
            transition: all 0.2s;
        }

        #difficulty-select button:hover {
            background: #333;
            color: #fff;
        }

        #difficulty-select button.active {
            background: #ff4500;
            color: #fff;
            border-color: #ff6347;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }

        #status {
            font-weight: bold;
            color: #ff4500;
        }

        #game-container {
            position: relative;
            border: 4px solid #333;
            background: #1e1e1e;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }

        #gameCanvas {
            display: block;
        }

        /* 縮小後的望遠鏡（直徑 100px） */
        #telescope {
            position: absolute;
            width: 100px;  
            height: 100px;
            border: 3px solid #ff4500; /* 亮橘紅色 */
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.8), inset 0 0 15px rgba(0,0,0,0.9);
            pointer-events: none; 
            transform: translate(-50%, -50%);
            display: none; 
            overflow: hidden;
            background-color: #252525;
        }

        #zoomCanvas {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
        }

        /* 狙擊鏡更明顯的十字線與核心準心 */
        #telescope::before, #telescope::after {
            content: '';
            position: absolute;
            background: rgba(255, 69, 0, 0.85); /* 提高透明度使十字更明顯 */
            box-shadow: 0 0 4px rgba(255, 69, 0, 0.5);
        }
        #telescope::before { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }
        #telescope::after { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }

        /* 中心精確瞄準環 */
        .center-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            border: 1.5px solid #ff4500;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="info">
        [ 左鍵 ]：探索區塊 | [ 右鍵 ]：標記地雷 <br>
        任務狀態：<span id="status">準備就緒</span>
    </div>

    <div id="difficulty-select">
        <button onclick="changeDifficulty(100, this)">偵查兵 (100雷)</button>
        <button onclick="changeDifficulty(200, this)">精英戰士 (200雷)</button>
        <button class="active" onclick="changeDifficulty(280, this)">噩夢大師 (280雷)</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="telescope">
            <div class="center-ring"></div>
            <canvas id="zoomCanvas"></canvas>
        </div>
    </div>

    <script>
        const COLS = 40;
        const ROWS = 40;
        const CELL_SIZE = 5; // 每格 5px
        const ZOOM_FACTOR = 6;  // 放大倍率
        
        // 降低滑鼠靈敏度（重力感緩動係數）：數值越小，望遠鏡移動越慢、越穩。建議 0.1 ~ 0.2 之間。
        const SENSITIVITY_SMOOTHING = 0.15; 

        let MINES_COUNT = 280; 

        const container = document.getElementById('game-container');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const telescope = document.getElementById('telescope');
        const zoomCanvas = document.getElementById('zoomCanvas');
        const zoomCtx = zoomCanvas.getContext('2d');
        const statusText = document.getElementById('status');

        canvas.width = COLS * CELL_SIZE;
        canvas.height = ROWS * CELL_SIZE;

        zoomCanvas.width = canvas.width * ZOOM_FACTOR;
        zoomCanvas.height = canvas.height * ZOOM_FACTOR;

        let grid = [];
        let gameOver = false;
        let gameWon = false;

        // 追蹤滑鼠與望遠鏡緩動座標
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;
        let isMouseIn = false;

        function initGame() {
            grid = [];
            gameOver = false;
            gameWon = false;
            statusText.innerText = `偵查中... (當前雷數: ${MINES_COUNT})`;
            statusText.style.color = "#ff4500";

            // 建立地圖並加入隨機視覺噪點
            for (let r = 0; r < ROWS; r++) {
                grid[r] = [];
                for (let c = 0; c < COLS; c++) {
                    let graySeed = Math.floor(Math.random() * 15); 
                    grid[r][c] = {
                        isMine: false,
                        revealed: false,
                        flagged: false,
                        neighborMines: 0,
                        colorUnrevealed: `rgb(${45 + graySeed}, ${45 + graySeed}, ${45 + graySeed})`,
                        colorRevealed: `rgb(${210 + graySeed}, ${210 + graySeed}, ${210 + graySeed})`,
                        flagOffset: Math.random() * 2 - 1 
                    };
                }
            }

            // 純隨機布雷
            let minesPlaced = 0;
            while (minesPlaced < MINES_COUNT) {
                let r = Math.floor(Math.random() * ROWS);
                let c = Math.floor(Math.random() * COLS);
                if (!grid[r][c].isMine) {
                    grid[r][c].isMine = true;
                    minesPlaced++;
                }
            }

            // 計算周圍雷數
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c].isMine) continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            let nr = r + dr;
                            let nc = c + dc;
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                                if (grid[nr][nc].isMine) count++;
                            }
                        }
                    }
                    grid[r][c].neighborMines = count;
                }
            }
            draw();
        }

        function changeDifficulty(mines, btnElement) {
            MINES_COUNT = mines;
            // 切換按鈕 active 樣式
            const buttons = document.querySelectorAll('#difficulty-select button');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            initGame();
        }

        // 繪製微型地圖
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let cell = grid[r][c];
                    let x = c * CELL_SIZE;
                    let y = r * CELL_SIZE;

                    if (cell.revealed) {
                        if (cell.isMine) {
                            ctx.fillStyle = '#ff2222';
                            ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                        } else {
                            ctx.fillStyle = cell.colorRevealed;
                            ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                            
                            if (cell.neighborMines > 0) {
                                const colors = ['', '#0033cc', '#006600', '#cc0000', '#000066', '#660000', '#006666', '#000000', '#555555'];
                                ctx.fillStyle = colors[cell.neighborMines];
                                ctx.fillRect(x + 2, y + 2, 1, 1); 
                            }
                        }
                    } else {
                        ctx.fillStyle = cell.colorUnrevealed;
                        ctx.fillRect(x, y, CELL_SIZE - 1, CELL_SIZE - 1); 

                        if (cell.flagged) {
                            ctx.fillStyle = '#ffaa00';
                            ctx.fillRect(x + 1, y + 1, CELL_SIZE - 3, CELL_SIZE - 3);
                        }
                    }
                }
            }
            updateZoom();
        }

        // 繪製望遠鏡內部
        function updateZoom() {
            zoomCtx.clearRect(0, 0, zoomCanvas.width, zoomCanvas.height);
            const Z_CELL = CELL_SIZE * ZOOM_FACTOR; 

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let cell = grid[r][c];
                    let x = c * Z_CELL;
                    let y = r * Z_CELL;

                    if (cell.revealed) {
                        if (cell.isMine) {
                            zoomCtx.fillStyle = '#ff2222';
                            zoomCtx.fillRect(x, y, Z_CELL, Z_CELL);
                            zoomCtx.fillStyle = '#000000';
                            zoomCtx.beginPath();
                            zoomCtx.arc(x + Z_CELL/2, y + Z_CELL/2, Z_CELL/4, 0, Math.PI*2);
                            zoomCtx.fill();
                        } else {
                            zoomCtx.fillStyle = cell.colorRevealed;
                            zoomCtx.fillRect(x, y, Z_CELL, Z_CELL);
                            zoomCtx.strokeStyle = '#cccccc';
                            zoomCtx.lineWidth = 1;
                            zoomCtx.strokeRect(x, y, Z_CELL, Z_CELL);

                            if (cell.neighborMines > 0) {
                                const colors = ['', '#1e88e5', '#43a047', '#e53935', '#8e24aa', '#fb8c00', '#00acc1', '#3949ab', '#424242'];
                                zoomCtx.fillStyle = colors[cell.neighborMines];
                                zoomCtx.font = `bold ${Z_CELL * 0.6}px monospace`;
                                zoomCtx.textAlign = 'center';
                                zoomCtx.textBaseline = 'middle';
                                zoomCtx.fillText(cell.neighborMines, x + Z_CELL/2, y + Z_CELL/2);
                            }
                        }
                    } else {
                        zoomCtx.fillStyle = cell.colorUnrevealed;
                        zoomCtx.fillRect(x, y, Z_CELL, Z_CELL);
                        
                        zoomCtx.strokeStyle = '#555555';
                        zoomCtx.lineWidth = 1;
                        zoomCtx.strokeRect(x, y, Z_CELL, Z_CELL);

                        if (cell.flagged) {
                            let ox = cell.flagOffset * 2;
                            zoomCtx.fillStyle = '#ff3333';
                            zoomCtx.beginPath();
                            zoomCtx.moveTo(x + Z_CELL * 0.35 + ox, y + Z_CELL * 0.2);
                            zoomCtx.lineTo(x + Z_CELL * 0.75 + ox, y + Z_CELL * 0.4);
                            zoomCtx.lineTo(x + Z_CELL * 0.35 + ox, y + Z_CELL * 0.6);
                            zoomCtx.fill();
                            
                            zoomCtx.strokeStyle = '#ffffff';
                            zoomCtx.lineWidth = 2;
                            zoomCtx.beginPath();
                            zoomCtx.moveTo(x + Z_CELL * 0.35 + ox, y + Z_CELL * 0.2);
                            zoomCtx.lineTo(x + Z_CELL * 0.35 + ox, y + Z_CELL * 0.8);
                            zoomCtx.stroke();
                        }
                    }
                }
            }
        }

        // 擴散演算法
        function revealCell(r, c) {
            if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
            let cell = grid[r][c];
            if (cell.revealed || cell.flagged) return;

            cell.revealed = true;

            if (cell.neighborMines === 0 && !cell.isMine) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        revealCell(r + dr, c + dc);
                    }
                }
            }
        }

        function checkWin() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!grid[r][c].isMine && !grid[r][c].revealed) return false;
                }
            }
            return true;
        }

        function doGameOver() {
            gameOver = true;
            statusText.innerText = "❌ 任務失敗！點擊地圖重組戰局";
            statusText.style.color = "#ff2222";
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c].isMine) grid[r][c].revealed = true;
                }
            }
            draw();
        }

        // 滑鼠移動時，只更新「目標位置」
        container.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            targetX = e.clientX - rect.left;
            targetY = e.clientY - rect.top;

            if (targetX >= 0 && targetX <= rect.width && targetY >= 0 && targetY <= rect.height) {
                isMouseIn = true;
            } else {
                isMouseIn = false;
            }
        });

        container.addEventListener('mouseleave', () => {
            isMouseIn = false;
        });

        // 利用心跳動畫 (Animation Loop) 實現平滑緩動 (模擬低靈敏度重量感)
        function animateTelescope() {
            if (isMouseIn) {
                telescope.style.display = 'block';
                
                // 線性插值公式：當前位置逐步逼近滑鼠位置
                currentX += (targetX - currentX) * SENSITIVITY_SMOOTHING;
                currentY += (targetY - currentY) * SENSITIVITY_SMOOTHING;

                telescope.style.left = currentX + 'px';
                telescope.style.top = currentY + 'px';

                // 連動放大鏡布景 (50 是望遠鏡半徑 100/2)
                const zoomX = -(currentX * ZOOM_FACTOR) + 50; 
                const zoomY = -(currentY * ZOOM_FACTOR) + 50;
                zoomCanvas.style.left = zoomX + 'px';
                zoomCanvas.style.top = zoomY + 'px';
            } else {
                telescope.style.display = 'none';
            }
            requestAnimationFrame(animateTelescope);
        }
        // 啟動動畫
        requestAnimationFrame(animateTelescope);

        // 點擊事件：改用緩動後的 currentX / currentY 進行判定，確保點擊位置就是眼睛看到的十字中心
        container.addEventListener('mousedown', (e) => {
            if (gameOver || gameWon) {
                initGame();
                return;
            }

            if (!isMouseIn) return;

            // 以十字準心當前的物理座標來計算格子
            const c = Math.floor(currentX / CELL_SIZE);
            const r = Math.floor(currentY / CELL_SIZE);

            if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                if (e.button === 0) { 
                    if (grid[r][c].flagged) return;
                    if (grid[r][c].isMine) {
                        doGameOver();
                    } else {
                        revealCell(r, c);
                        if (checkWin()) {
                            gameWon = true;
                            statusText.innerText = "🏆 任務成功！點擊畫面重新挑戰";
                            statusText.style.color = "#00ff00";
                        }
                        draw();
                    }
                } else if (e.button === 2) { 
                    grid[r][c].flagged = !grid[r][c].flagged;
                    draw();
                }
            }
        });

        container.addEventListener('contextmenu', e => e.preventDefault());

        // 初始化
        initGame();
    </script>
</body>
</html>
